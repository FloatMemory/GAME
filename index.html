<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090b0d">
  <title>零点之后 — 午夜旅馆</title>
  <style>
    :root{color-scheme:dark;--ink:#d8d1c5;--muted:#89867f;--red:#a64d46;--panel:#111416}
    *{box-sizing:border-box}body{margin:0;background:#090b0d;color:var(--ink);font:15px/1.6 Georgia,"Noto Serif SC",serif;min-height:100vh;display:grid;place-items:center;padding:22px}
    .shell{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin:0 0 12px;gap:12px}.eyebrow{font:10px/1.4 Arial,sans-serif;letter-spacing:.28em;color:#a64d46;text-transform:uppercase}h1{font-size:clamp(23px,4vw,36px);font-weight:400;letter-spacing:.12em;margin:2px 0 0}.subtitle{font-size:12px;color:var(--muted);text-align:right}
    .frame{position:relative;background:#050607;border:1px solid #343331;box-shadow:0 18px 70px #000b;overflow:hidden}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#fff0 60%,#0004),repeating-linear-gradient(0deg,#fff0 0 3px,#00000008 4px 5px)}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#060809d9;z-index:2;text-align:center}.card{width:min(480px,100%);padding:clamp(22px,5vw,42px);background:#101315ed;border:1px solid #514640;box-shadow:0 15px 70px #000}.card h2{font-weight:400;font-size:clamp(24px,5vw,36px);letter-spacing:.12em;margin:0 0 10px}.card p{color:#c1b9ad;margin:10px auto;max-width:38ch}.card .small{font-size:12px;color:#928d84}.button{border:1px solid #a34a43;background:#6c2925;color:#f1e8dc;padding:11px 26px;font:inherit;letter-spacing:.12em;cursor:pointer;margin-top:12px}.button:hover{background:#873a34}.hidden{display:none!important}
    .bar{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 12px;background:#101315;border:1px solid #292b2c;border-top:0;font:12px/1.5 Arial,sans-serif;color:#c3bdb3}.stats{display:flex;gap:18px;flex-wrap:wrap}.stat span{color:#888}.battery{display:inline-block;width:64px;height:7px;border:1px solid #666;margin-left:6px;vertical-align:1px}.battery i{height:100%;display:block;width:100%;background:#c9b276;transition:width .2s}.hint{color:#a7a096;text-align:right}.mobile{display:none;gap:7px;justify-content:center;margin-top:12px;touch-action:none}.mobile button{width:48px;height:42px;border:1px solid #444;background:#151819;color:#ddd;font-size:18px;touch-action:none}.mobile .actions{display:flex;gap:7px;margin-left:12px}.mobile .actions button{font-size:12px;width:62px}
    @media(max-width:650px){body{padding:12px}.subtitle{display:none}.bar{align-items:flex-start}.hint{max-width:130px}.mobile{display:flex}.stats{gap:9px}.stat{font-size:11px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">A small horror game · 01</div><h1>零点之后</h1></div><div class="subtitle">白榆旅馆 · 第七码头<br>1998年11月17日　23:57</div></header>
    <section class="frame" aria-label="游戏画面">
      <canvas id="game" width="1056" height="672" aria-label="午夜旅馆探索游戏"></canvas>
      <div class="overlay" id="overlay"><div class="card"><div class="eyebrow">白榆旅馆 · 失物招领处</div><h2 id="cardTitle">最后一位住客</h2><p id="cardText">电梯在零点停下。走廊尽头的电话响了三次，而前台说——这层楼早在二十年前就封了。</p><p class="small">找到三张值班记录，弄清今晚发生了什么，然后离开旅馆。别让手电熄灭。</p><button class="button" id="start">进入旅馆</button><p class="small">移动：WASD / 方向键　手电：空格　调查 / 躲藏：E</p></div></div>
    </section>
    <div class="bar"><div class="stats"><div class="stat">记录 <b id="notes">0 / 3</b></div><div class="stat">手电<span class="battery"><i id="battery"></i></span></div><div class="stat">时间 <b id="clock">23:57</b></div></div><div class="hint" id="hint">准备好后，进入旅馆。</div></div>
    <div class="mobile" aria-label="触屏控制"><div class="dpad"><button data-key="ArrowUp">↑</button><div><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div></div><div class="actions"><button data-key="e">调查 E</button><button data-key=" ">手电</button></div></div>
  </main>
<script>
(()=>{
  const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
  const COLS=22,ROWS=14,T=48;
  const grid=Array.from({length:ROWS},()=>Array(COLS).fill('#'));
  function carve(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]='.'}
  carve(1,7,20,1);carve(2,2,5,5);carve(4,6,1,2);carve(8,2,6,4);carve(10,5,1,3);carve(15,2,6,5);carve(17,6,1,2);
  carve(2,9,6,4);carve(4,7,1,3);carve(9,9,5,4);carve(11,7,1,3);carve(15,9,6,4);carve(17,7,1,3);
  const notes=[{x:3,y:3,text:'11月17日。又有人在午夜后按了七码头的电梯。监控里没有人，但楼层指示灯自己亮了。'},{x:10,y:3,text:'前台说不要回应走廊里的敲门声。可今晚，敲门声是从房间里面传出来的。'},{x:19,y:3,text:'如果你读到这张纸，别去地下室。那东西穿着我的制服。它已经学会用我的声音说话。'}];
  const batteries=[{x:6,y:4,used:false},{x:12,y:11,used:false}];
  const closets=[{x:6,y:5},{x:13,y:4},{x:16,y:11}];const exit={x:20,y:11};
  let player,ghost,keys={},running=false,dead=false,won=false,elapsed=0,flash=100,lightOn=true,found=0,hidden=false,toast='',toastUntil=0,ghostStep=0,last=0;
  function reset(){player={x:3.3,y:7.5};ghost={x:18.3,y:7.5,tx:18,ty:7};keys={};running=false;dead=false;won=false;elapsed=0;flash=100;lightOn=true;found=0;hidden=false;toast='';notes.forEach(n=>n.got=false);batteries.forEach(b=>b.used=false);}
  function announce(s){toast=s;toastUntil=elapsed+2.7;document.querySelector('#hint').textContent=s}
  function wall(x,y){const gx=Math.floor(x),gy=Math.floor(y);return gx<0||gy<0||gx>=COLS||gy>=ROWS||grid[gy][gx]==='#'}
  function moveEntity(obj,dx,dy){const r=.23;const nx=obj.x+dx,ny=obj.y+dy;if(!wall(nx-r,obj.y-r)&&!wall(nx+r,obj.y+r))obj.x=nx;if(!wall(obj.x-r,ny-r)&&!wall(obj.x+r,ny+r))obj.y=ny}
  function nearby(o){return Math.hypot(player.x-(o.x+.5),player.y-(o.y+.5))<1.05}
  function interact(){if(!running||dead||won)return;if(hidden){hidden=false;announce('你屏住呼吸，重新回到走廊。');return}
    for(const n of notes){if(!n.got&&nearby(n)){n.got=true;found++;announce('值班记录 '+found+' / 3：'+n.text);return}}
    for(const b of batteries){if(!b.used&&nearby(b)){b.used=true;flash=Math.min(100,flash+48);announce('你换上了一节电池。手电恢复了一些电量。');return}}
    for(const c of closets){if(nearby(c)){hidden=true;announce('你躲进柜子。外面传来湿漉漉的脚步声……');return}}
    if(nearby(exit)){if(found===3){won=true;running=false;showCard('天快亮了','你冲出旅馆。身后的电梯门缓缓合上，楼层显示屏上，红色的数字仍停在：7。','再玩一次');}else announce('出口被锁住了。还缺 '+(3-found)+' 张值班记录。');return}
    announce('什么也没有。');
  }
  function pathStep(){const sx=Math.floor(ghost.x),sy=Math.floor(ghost.y),tx=Math.floor(player.x),ty=Math.floor(player.y);if(sx===tx&&sy===ty)return;
    const q=[[sx,sy]],prev=new Map([[sx+','+sy,null]]);let end=null;for(let i=0;i<q.length;i++){const [x,y]=q[i];if(x===tx&&y===ty){end=[x,y];break}for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(a>=0&&b>=0&&a<COLS&&b<ROWS&&grid[b][a]!== '#'&&!prev.has(k)){prev.set(k,[x,y]);q.push([a,b])}}}
    if(!end)return;let cur=end;while(prev.get(cur[0]+','+cur[1])&&!(prev.get(cur[0]+','+cur[1])[0]===sx&&prev.get(cur[0]+','+cur[1])[1]===sy))cur=prev.get(cur[0]+','+cur[1]);ghost.tx=cur[0];ghost.ty=cur[1];
  }
  function update(dt){if(!running)return;elapsed+=dt;if(lightOn)flash=Math.max(0,flash-dt*.72);if(flash<=0&&lightOn){lightOn=false;announce('手电没电了。黑暗里有什么东西正在靠近。')}
    if(!hidden){let dx=0,dy=0;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;if(dx&&dy){dx*=.707;dy*=.707}moveEntity(player,dx*2.35*dt,dy*2.35*dt)}
    if(found>0&&!hidden){ghostStep-=dt;if(ghostStep<=0){pathStep();ghostStep=.48}const gx=ghost.tx+.5-ghost.x,gy=ghost.ty+.5-ghost.y,dist=Math.hypot(gx,gy);if(dist>.05){const speed=found===3?1.22:.78;moveEntity(ghost,gx/dist*speed*dt,gy/dist*speed*dt)}if(Math.hypot(player.x-ghost.x,player.y-ghost.y)<.62){dead=true;running=false;showCard('它找到你了','湿冷的手从黑暗里伸出来。旅馆又多了一位永远不会退房的住客。','再试一次')}}
    if(elapsed>180&&!dead&&!won){/*时间只推进氛围，不会强制结束*/}
    document.querySelector('#notes').textContent=found+' / 3';document.querySelector('#battery').style.width=flash+'%';document.querySelector('#battery').style.background=flash<25?'#a64d46':'#c9b276';document.querySelector('#clock').textContent='23:'+String((57+Math.floor(elapsed/4))%60).padStart(2,'0');
    if(toastUntil<elapsed){document.querySelector('#hint').textContent=hidden?'你藏在柜子里。按 E 离开。':(found===3?'记录齐了。找到出口。':'WASD 移动 · E 调查 · 空格开关手电')}
  }
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#111312';ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x*T,py=y*T;if(grid[y][x]==='#'){ctx.fillStyle='#252725';ctx.fillRect(px,py,T,T);ctx.fillStyle='#30322f';ctx.fillRect(px+2,py+2,T-4,3);ctx.fillStyle='#1b1d1b';ctx.fillRect(px+3,py+T-5,T-6,3)}else{ctx.fillStyle=((x+y)%2)?'#343531':'#302f2b';ctx.fillRect(px,py,T,T);ctx.strokeStyle='#3c3a34';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px+5,py+T-7);ctx.lineTo(px+T-8,py+T-7);ctx.stroke()}}
    // Guest-room doors and room numbers
    [[3,2,'03'],[9,2,'07'],[16,2,'12'],[3,9,'18'],[10,9,'21'],[16,9,'27']].forEach(([x,y,n])=>{ctx.fillStyle='#777064';ctx.font='11px Arial';ctx.fillText(n,x*T+8,y*T+15)});
    notes.forEach((n,i)=>{if(n.got)return;const x=n.x*T+24,y=n.y*T+26;ctx.fillStyle='#b9a67c';ctx.save();ctx.translate(x,y);ctx.rotate(-.08);ctx.fillRect(-8,-10,16,20);ctx.fillStyle='#50483a';ctx.fillRect(-5,-5,10,1);ctx.fillRect(-5,0,8,1);ctx.fillRect(-5,5,9,1);ctx.restore();});
    batteries.forEach(b=>{if(b.used)return;ctx.fillStyle='#b0a36f';ctx.fillRect(b.x*T+17,b.y*T+19,14,9);ctx.fillStyle='#eee0a1';ctx.fillRect(b.x*T+30,b.y*T+21,3,5)});
    closets.forEach(c=>{ctx.fillStyle='#4b342b';ctx.fillRect(c.x*T+8,c.y*T+5,32,38);ctx.strokeStyle='#73513c';ctx.strokeRect(c.x*T+8,c.y*T+5,32,38);ctx.fillStyle='#bd9462';ctx.fillRect(c.x*T+34,c.y*T+24,2,3)});
    ctx.fillStyle=found===3?'#7b3730':'#3b302b';ctx.fillRect(exit.x*T+8,exit.y*T+4,32,43);ctx.strokeStyle='#9a6951';ctx.strokeRect(exit.x*T+8,exit.y*T+4,32,43);ctx.fillStyle='#d2a368';ctx.beginPath();ctx.arc(exit.x*T+34,exit.y*T+27,2,0,Math.PI*2);ctx.fill();
    // ghost
    if(found>0){const pulse=.85+Math.sin(elapsed*6)*.1;ctx.save();ctx.translate(ghost.x*T,ghost.y*T);ctx.scale(pulse,1);ctx.fillStyle='#b4b1a6';ctx.globalAlpha=.88;ctx.beginPath();ctx.ellipse(0,0,12,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#302322';ctx.beginPath();ctx.arc(-4,-3,2,0,7);ctx.arc(4,-3,2,0,7);ctx.fill();ctx.restore()}
    if(!hidden){const px=player.x*T,py=player.y*T;ctx.fillStyle='#b9b1a3';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#232522';ctx.beginPath();ctx.arc(px,py-2,5,0,Math.PI*2);ctx.fill()}
    // darkness mask with a soft flashlight pool
    const darkness=lightOn?(.87+(100-flash)/100*.07):.965;ctx.save();ctx.fillStyle=`rgba(3,5,7,${darkness})`;ctx.fillRect(0,0,canvas.width,canvas.height);if(lightOn&&!hidden){ctx.globalCompositeOperation='destination-out';const glow=ctx.createRadialGradient(player.x*T,player.y*T,24,player.x*T,player.y*T,Math.max(120,260*flash/100));glow.addColorStop(0,'rgba(0,0,0,.98)');glow.addColorStop(.58,'rgba(0,0,0,.8)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(player.x*T,player.y*T,Math.max(120,260*flash/100),0,Math.PI*2);ctx.fill()}ctx.restore();
    if(found&&Math.hypot(player.x-ghost.x,player.y-ghost.y)<3.5){ctx.fillStyle=`rgba(130,20,15,${(1-Math.hypot(player.x-ghost.x,player.y-ghost.y)/3.5)*.12})`;ctx.fillRect(0,0,canvas.width,canvas.height)}
    if(toastUntil>elapsed&&toast){ctx.fillStyle='#e7dcc7';ctx.font='16px Georgia';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=6;ctx.fillText(toast.length>52?toast.slice(0,51)+'…':toast,canvas.width/2,canvas.height-28);ctx.shadowBlur=0;ctx.textAlign='left'}
  }
  function showCard(title,text,button){document.querySelector('#cardTitle').textContent=title;document.querySelector('#cardText').textContent=text;document.querySelector('#start').textContent=button;document.querySelector('#overlay').classList.remove('hidden')}
  function begin(){reset();running=true;last=performance.now();document.querySelector('#overlay').classList.add('hidden');announce('电梯门在你身后关上。')}
  document.querySelector('#start').addEventListener('click',begin);
  window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();if(k==='e'&&!e.repeat)interact();if(k===' '&&!e.repeat&&running){lightOn=!lightOn;if(lightOn&&flash<=0)lightOn=false;announce(lightOn?'手电亮了。':'你关掉手电，听见远处有东西在笑。')}keys[k]=true});
  window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});window.addEventListener('blur',()=>keys={});
  document.querySelectorAll('.mobile button').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();if(k==='e')interact();else if(k===' '){lightOn=!lightOn&&flash>0;announce(lightOn?'手电亮了。':'手电已关闭。')}else keys[k]=true};const up=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)});
  function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
