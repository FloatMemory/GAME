<body><main class="shell">

<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false}),W=canvas.width,H=canvas.height,MW=24,MH=20;
const map=Array.from({length:MH},()=>Array(MW).fill(1));
function clearRect(x1,y1,x2,y2){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(x>0&&y>0&&x<MW-1&&y<MH-1)map[y][x]=0}
function path(x1,y1,x2,y2){let x=x1,y=y1;map[y][x]=0;while(x!==x2||y!==y2){if(x!==x2)x+=Math.sign(x2-x);else y+=Math.sign(y2-y);map[y][x]=0}}
// Hand-built forest clearings and connected trails.
clearRect(1,1,6,5);path(3,4,3,10);clearRect(2,8,11,11);path(10,9,18,9);clearRect(15,6,21,12);path(18,10,18,17);clearRect(14,15,21,18);path(5,9,5,15);clearRect(2,13,7,17);
// Broken fence and cabin-like ruins add landmarks without blocking the main trails.
[[7,3],[7,4],[12,4],[13,4],[14,8],[14,10],[9,12],[10,12],[12,14],[13,14],[8,15],[9,15],[11,16],[12,16],[20,5],[20,13],[3,12],[6,12]].forEach(([x,y])=>map[y][x]=1);
const cells={records:[{x:4.5,y:2.5,text:'林场日志：23:57，西边的雾里有灯。没有人承认点过它。'},{x:10.5,y:7.5,text:'值班记录：不要看林子里那个白色的人。它会学你走路。'},{x:4.5,y:15.5,text:'最后一页：门钥匙在旧木屋附近。开门后不要回头。'}],batteries:[{x:2.5,y:7.5,used:false},{x:19.5,y:15.5,used:false}],keys:[{x:16.5,y:10.5,got:false}],hides:[{x:5.5,y:14.5},{x:19.5,y:8.5}],exit:{x:18.5,y:17.2}};
const state={running:false,paused:false,won:false,dead:false,player:{x:3.5,y:2.8,angle:Math.PI*.52},monster:{x:18.5,y:9.5,tx:18,ty:9},keys:{},notes:0,hasKey:false,battery:100,flashlight:true,hidden:false,elapsed:0,toast:'',toastUntil:0,stepTimer:0,footstepTimer:0,last:0,dragX:null,runTouch:false};
const depth=new Float32Array(W),overlay=document.querySelector('#overlay'),hint=document.querySelector('#hint'),notice=document.querySelector('#notice');
let audio=null,ambient=null;
function announce(text,seconds=2.8){state.toast=text;state.toastUntil=state.elapsed+seconds;hint.textContent=text;notice.textContent=text;setTimeout(()=>{if(notice.textContent===text)notice.textContent=''},Math.max(300,seconds*1000))}
function tile(x,y){x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=MW||y>=MH?1:map[y][x]}
function canStand(x,y,r=.2){return tile(x-r,y-r)===0&&tile(x+r,y-r)===0&&tile(x-r,y+r)===0&&tile(x+r,y+r)===0}
function move(obj,dx,dy,r=.2){const ox=obj.x,oy=obj.y,nx=obj.x+dx,ny=obj.y+dy;if(canStand(nx,obj.y,r))obj.x=nx;if(canStand(obj.x,ny,r))obj.y=ny;if(!canStand(obj.x,obj.y,r)){obj.x=ox;obj.y=oy}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function audioStart(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();if(audio.state==='suspended')audio.resume();ambient=audio.createOscillator();const gain=audio.createGain();ambient.type='sawtooth';ambient.frequency.value=47;gain.gain.value=.012;ambient.connect(gain);gain.connect(audio.destination);ambient.start()}
function tone(freq=220,duration=.12,volume=.07,type='sine'){if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(volume,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}
function reset(){state.player={x:3.5,y:2.8,angle:Math.PI*.52};state.monster={x:18.5,y:9.5,tx:18,ty:9};state.keys={};state.notes=0;state.hasKey=false;state.battery=100;state.flashlight=true;state.hidden=false;state.elapsed=0;state.toast='';state.toastUntil=0;state.stepTimer=0;state.footstepTimer=0;state.dead=false;state.won=false;state.paused=false;state.dragX=null;cells.records.forEach(n=>n.got=false);cells.batteries.forEach(b=>b.used=false);cells.keys.forEach(k=>k.got=false)}
function collectOrInteract(){if(!state.running||state.paused||state.dead||state.won)return;if(state.hidden){state.hidden=false;announce('你从木柜里钻出来，雾里的脚步声又动了。');return}const p=state.player;
 for(const n of cells.records){if(!n.got&&d(p,n)<1.1){n.got=true;state.notes++;announce('记录 '+state.notes+' / 3：'+n.text,4.2);tone(460,.16,.08,'triangle');return}}
 for(const b of cells.batteries){if(!b.used&&d(p,b)<1){b.used=true;state.battery=Math.min(100,state.battery+42);announce('拾到电池。手电电量恢复。');tone(650,.1,.07,'square');return}}
 for(const k of cells.keys){if(!k.got&&d(p,k)<1){k.got=true;state.hasKey=true;announce('你拿到了旧木屋的钥匙。');tone(820,.13,.07,'triangle');return}}
 for(const h of cells.hides){if(d(p,h)<.85){state.hidden=true;announce('你躲进木柜，尽量不发出声音。');return}}
 if(d(p,cells.exit)<1.15){if(state.notes===3&&state.hasKey){state.won=true;state.running=false;showCard('公路尽头','你冲出雾林。远处的路灯一个接一个熄灭。后座上，传来三下轻轻的敲门声。','再来一次')}else announce(state.notes<3?'铁门锁死了，还缺 '+(3-state.notes)+' 张记录。':'门锁需要旧钥匙。');return}
 announce('附近没有能调查的东西。')}
function showCard(title,text,button){document.querySelector('#cardTitle').textContent=title;document.querySelector('#cardText').textContent=text;document.querySelector('#start').textContent=button;overlay.classList.remove('hidden')}
function toggleLight(){if(!state.running||state.paused||state.dead||state.won)return;if(!state.flashlight&&state.battery<=0){announce('电池已经耗尽。');return}state.flashlight=!state.flashlight;announce(state.flashlight?'手电亮了。':'你关掉手电，黑暗里传来树枝折断声。');tone(state.flashlight?370:130,.08,.04)}
function findNextCell(sx,sy,tx,ty){const queue=[[sx,sy]],prev=new Map([[`${sx},${sy}`,null]]);let head=0;while(head<queue.length){const [x,y]=queue[head++];if(x===tx&&y===ty){let cur=[x,y];while(true){const p=prev.get(`${cur[0]},${cur[1]}`);if(!p||p[0]===sx&&p[1]===sy)return cur;cur=p}}for(const [dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,key=`${nx},${ny}`;if(nx<=0||ny<=0||nx>=MW-1||ny>=MH-1||tile(nx,ny)||prev.has(key))continue;prev.set(key,[x,y]);queue.push([nx,ny])}}return[sx,sy]}
function updateMonster(dt){if(state.notes===0||state.hidden)return;state.stepTimer-=dt;if(state.stepTimer<=0){state.stepTimer=.38;const m=state.monster,p=state.player;const next=findNextCell(Math.floor(m.x),Math.floor(m.y),Math.floor(p.x),Math.floor(p.y));m.tx=next[0];m.ty=next[1]}const m=state.monster,dx=m.tx+.5-m.x,dy=m.ty+.5-m.y,len=Math.hypot(dx,dy);if(len>.03){const speed=state.notes>=3?1.18:.78;move(m,dx/len*speed*dt,dy/len*speed*dt,.18)}if(d(state.player,m)<.62){state.dead=true;state.running=false;tone(75,.7,.18,'sawtooth');showCard('雾里的人追上你了','它没有脸，却用你的声音叫出了你的名字。','再试一次')}}
function update(dt){if(!state.running||state.paused||state.dead||state.won)return;state.elapsed+=dt;if(state.flashlight){state.battery=Math.max(0,state.battery-dt*.72);if(state.battery===0){state.flashlight=false;announce('手电熄灭了。雾里的脚步声正在靠近。',4);tone(95,.35,.08,'sawtooth')}}
 let forward=0,turn=0;if(state.keys.w||state.keys.ArrowUp)forward++;if(state.keys.s||state.keys.ArrowDown)forward--;if(state.keys.a||state.keys.ArrowLeft)turn--;if(state.keys.d||state.keys.ArrowRight)turn++;
 if(forward){const fast=state.keys.Shift||state.runTouch,speed=fast?2.45:1.65;move(state.player,Math.cos(state.player.angle)*forward*speed*dt,Math.sin(state.player.angle)*forward*speed*dt,.19);state.footstepTimer-=dt;if(state.footstepTimer<=0){state.footstepTimer=fast?.28:.48;tone(fast?62:75,.055,fast?.025:.014,'triangle')}}
 if(turn)state.player.angle+=turn*2.15*dt;
 updateMonster(dt);
 document.querySelector('#notes').textContent=state.notes+' / 3';document.querySelector('#key').textContent=state.hasKey?'有':'无';document.querySelector('#battery').style.width=state.battery+'%';document.querySelector('#battery').style.background=state.battery<22?'#a04944':'#d5bf82';document.querySelector('#clock').textContent='23:'+String((57+Math.floor(state.elapsed/4))%60).padStart(2,'0');
 if(state.toastUntil<state.elapsed)hint.textContent=state.hidden?'你藏在木柜里。按 E 离开。':(state.notes===3&&state.hasKey?'记录和钥匙都齐了，寻找公路铁门。':'WASD 移动 · E 调查 · 空格手电 · P 暂停')}
function castRay(angle){const p=state.player,rayX=Math.cos(angle),rayY=Math.sin(angle);let mapX=Math.floor(p.x),mapY=Math.floor(p.y);const deltaX=Math.abs(1/(rayX||1e-12)),deltaY=Math.abs(1/(rayY||1e-12));let stepX,stepY,sideX,sideY;if(rayX<0){stepX=-1;sideX=(p.x-mapX)*deltaX}else{stepX=1;sideX=(mapX+1-p.x)*deltaX}if(rayY<0){stepY=-1;sideY=(p.y-mapY)*deltaY}else{stepY=1;sideY=(mapY+1-p.y)*deltaY}let side=0,steps=0;while(steps++<64){if(sideX<sideY){sideX+=deltaX;mapX+=stepX;side=0}else{sideY+=deltaY;mapY+=stepY;side=1}if(tile(mapX,mapY)===1)break}let dist=side===0?(mapX-p.x+(1-stepX)/2)/(rayX||1e-12):(mapY-p.y+(1-stepY)/2)/(rayY||1e-12);dist=Math.max(.001,Math.min(dist,40));const wallX=side===0?p.y+dist*rayY:p.x+dist*rayX;return{dist,side,wallX:wallX-Math.floor(wallX),mapX,mapY}}
function renderWorld(){const horizon=Math.floor(H*.48);const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#080c0b');sky.addColorStop(1,'#202521');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);const floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#34362f');floor.addColorStop(1,'#090b0a');ctx.fillStyle=floor;ctx.fillRect(0,horizon,W,H-horizon);const fov=Math.PI*.36,step=2;for(let x=0;x<W;x+=step){const cam=2*x/W-1,rayAngle=state.player.angle+Math.atan(cam*Math.tan(fov)),hit=castRay(rayAngle),perp=hit.dist*Math.cos(rayAngle-state.player.angle),wallH=Math.min(H*2,H/(perp||.01)),top=horizon-wallH/2;depth[x]=depth[x+1]=perp;let band=Math.floor(hit.wallX*12)%2,shade=(hit.side?.72:1)*(band?.82:1);const fog=Math.max(.13,1-perp/13);shade*=fog;const r=Math.floor((hit.side?75:112)*shade),g=Math.floor((hit.side?88:98)*shade),b=Math.floor((hit.side?78:82)*shade);ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(x,top,step+1,wallH);ctx.fillStyle=`rgba(11,13,12,${Math.min(.7,perp/24)})`;ctx.fillRect(x,top,step+1,wallH);ctx.fillStyle='rgba(200,190,154,.09)';ctx.fillRect(x,top+wallH*.08,step+1,2)}}
function sprite(x,y,type,label){const p=state.player,dx=x-p.x,dy=y-p.y,dist=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)-p.angle;let rel=Math.atan2(Math.sin(angle),Math.cos(angle));const fov=Math.PI*.36;if(Math.abs(rel)>fov+.25||dist<.1)return;const screenX=W/2+(Math.tan(rel)/Math.tan(fov))*W/2,size=Math.min(H*1.6,H/(dist*Math.cos(rel))),base=H*.48+size*.38,alpha=Math.max(.18,Math.min(1,1-dist/15));if(screenX<0||screenX>=W)return;const depthAt=depth[Math.min(W-1,Math.max(0,Math.floor(screenX)))];if(dist*Math.cos(rel)>depthAt+.2)return;ctx.save();ctx.globalAlpha=alpha;if(type==='monster'){ctx.fillStyle='#b8b6ad';ctx.beginPath();ctx.ellipse(screenX,base-size*.48,size*.16,size*.40,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#120f0e';ctx.fillRect(screenX-size*.07,base-size*.69,size*.045,size*.035);ctx.fillRect(screenX+size*.025,base-size*.69,size*.045,size*.035);ctx.fillStyle='#3c3630';ctx.fillRect(screenX-size*.17,base-size*.12,size*.34,size*.07)}else if(type==='record'){ctx.fillStyle='#c9b68a';ctx.fillRect(screenX-size*.1,base-size*.43,size*.2,size*.27);ctx.fillStyle='#494131';ctx.fillRect(screenX-size*.07,base-size*.35,size*.14,2);ctx.fillRect(screenX-size*.07,base-size*.28,size*.13,2)}else if(type==='battery'){ctx.fillStyle='#d5c16e';ctx.fillRect(screenX-size*.13,base-size*.3,size*.26,size*.13);ctx.fillStyle='#fff0a1';ctx.fillRect(screenX+size*.11,base-size*.27,size*.045,size*.07)}else if(type==='key'){ctx.fillStyle='#d7bd75';ctx.beginPath();ctx.arc(screenX,base-size*.32,size*.08,0,Math.PI*2);ctx.fill();ctx.fillRect(screenX,base-size*.3,size*.17,size*.035)}else if(type==='gate'){ctx.strokeStyle='#9b765b';ctx.lineWidth=Math.max(2,size*.035);ctx.strokeRect(screenX-size*.19,base-size*.78,size*.38,size*.78);ctx.fillStyle='#d2a368';ctx.beginPath();ctx.arc(screenX+size*.12,base-size*.35,size*.025,0,Math.PI*2);ctx.fill()}
 if(label&&dist<1.6){ctx.font='12px Arial';ctx.textAlign='center';ctx.fillStyle='#eee2c9';ctx.fillText(label,screenX,base-size*.88)}ctx.restore()}
function renderSprites(){const all=[];for(const n of cells.records)if(!n.got)all.push({...n,type:'record',label:'E · 调查'});for(const b of cells.batteries)if(!b.used)all.push({...b,type:'battery',label:'E · 拾取'});for(const k of cells.keys)if(!k.got)all.push({...k,type:'key',label:'E · 钥匙'});for(const h of cells.hides)all.push({...h,type:'gate',label:'E · 躲藏'});all.push({...cells.exit,type:'gate',label:state.hasKey?'E · 逃离':'铁门锁住'});if(state.notes>0&&!state.hidden)all.push({...state.monster,type:'monster'});all.sort((a,b)=>d(state.player,b)-d(state.player,a));for(const s of all)sprite(s.x,s.y,s.type,s.label)}
function render(){renderWorld();renderSprites();if(state.flashlight&&!state.hidden){ctx.save();ctx.globalCompositeOperation='multiply';const glow=ctx.createRadialGradient(W/2,H*.52,12,W/2,H*.52,Math.max(100,300*state.battery/100));glow.addColorStop(0,'rgba(255,244,205,.22)');glow.addColorStop(.6,'rgba(200,192,160,.08)');glow.addColorStop(1,'rgba(0,0,0,.7)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.restore()}if(state.paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#eee';ctx.font='28px Georgia';ctx.textAlign='center';ctx.fillText('已暂停 · 按 P 继续',W/2,H/2);ctx.textAlign='left'}if(state.toastUntil>state.elapsed&&!state.paused){ctx.fillStyle='#f0e5d1';ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillText(state.toast.length>64?state.toast.slice(0,62)+'…':state.toast,W/2,H-20);ctx.textAlign='left'}}
function begin(){reset();state.running=true;state.last=performance.now();overlay.classList.add('hidden');audioStart();announce('车灯熄灭了。你只剩手电和一条通往林场的小路。');tone(120,.35,.06,'sawtooth')}
startBtn.addEventListener('click',begin);
function keyDown(ev){const k=ev.key.length===1?ev.key.toLowerCase():ev.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))ev.preventDefault();if(k==='e'&&!ev.repeat)collectOrInteract();if(k===' '&&!ev.repeat)toggleLight();if(k==='p'&&!ev.repeat&&state.running){state.paused=!state.paused;hint.textContent=state.paused?'已暂停，按 P 继续。':'继续逃跑。';state.last=performance.now()}state.keys[k]=true}
function keyUp(ev){const k=ev.key.length===1?ev.key.toLowerCase():ev.key;state.keys[k]=false}
window.addEventListener('keydown',keyDown);window.addEventListener('keyup',keyUp);window.addEventListener('blur',()=>{state.keys={};if(state.running&&!state.paused){state.paused=true;hint.textContent='已暂停，按 P 继续。'}});
const mobile=document.querySelector('#mobile');document.querySelectorAll('.pad button').forEach(btn=>{const key=btn.dataset.key,stop=e=>{e.preventDefault();state.keys[key]=false};btn.addEventListener('pointerdown',e=>{e.preventDefault();state.keys[key]=true;btn.setPointerCapture?.(e.pointerId)});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('lostpointercapture',stop)});
document.querySelector('[data-action="interact"]').addEventListener('pointerdown',e=>{e.preventDefault();collectOrInteract()});document.querySelector('[data-action="light"]').addEventListener('pointerdown',e=>{e.preventDefault();toggleLight()});document.querySelector('[data-action="run"]').addEventListener('pointerdown',e=>{e.preventDefault();state.runTouch=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])document.querySelector('[data-action="run"]').addEventListener(ev,e=>{e.preventDefault();state.runTouch=false});
// Dragging over the game turns the camera; pointer lock is optional and never required.
let lookPointer=null;canvas.addEventListener('pointerdown',e=>{if(!state.running||e.pointerType==='touch')return;lookPointer=e.clientX;canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(lookPointer===null||e.pointerType==='touch')return;const dx=e.clientX-lookPointer;lookPointer=e.clientX;state.player.angle+=dx*.0045});canvas.addEventListener('pointerup',()=>lookPointer=null);canvas.addEventListener('pointercancel',()=>lookPointer=null);
function loop(now){const dt=Math.min(.04,Math.max(0,(now-state.last)/1000||0));state.last=now;update(dt);render();requestAnimationFrame(loop)}
reset();state.last=performance.now();requestAnimationFrame(loop);
})();
</script>
